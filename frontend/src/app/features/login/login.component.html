<div class="aurora" aria-hidden="true"></div>
<div class="login-wrap">
  <div class="login-card" xpSpotlight>
    <div class="brand">
      <img src="/xpandex-wordmark.png" alt="Xpandex" class="brand-wordmark" />
      <span class="chip"><span class="dot"></span>Admin panel</span>
    </div>

    <form (submit)="$event.preventDefault(); submit()" class="stack">
      <label>
        Email
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          autocomplete="username"
          required
          autofocus
        />
      </label>

      <label>
        Contraseña
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          autocomplete="current-password"
          required
        />
      </label>

      <xp-arrow-btn type="submit" [disabled]="loading()">
        {{ loading() ? 'Entrando...' : 'Entrar' }}
      </xp-arrow-btn>

      @if (error(); as msg) {
        <p class="error-banner">{{ msg }}</p>
      }
    </form>
  </div>
</div>
