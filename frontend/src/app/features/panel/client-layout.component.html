<header class="panel-head" [class.scrolled]="scrolled()">
  <div class="panel-pill">
    <div class="brand">
      <img src="/xpandex-wordmark.png" alt="Xpandex" class="brand-wordmark" />
      <span class="panel-tag">Panel de cliente</span>
    </div>
    <div class="panel-user">
      @if (client(); as c) {
        <span class="who">{{ c.name }}</span>
      }
      <a class="ghost btn-link" routerLink="/panel/ajustes">Ajustes</a>
      <button class="ghost" (click)="logout()">Cerrar sesión</button>
    </div>
  </div>
</header>

@if (onDashboard()) {
<nav class="panel-subnav" [class.scrolled]="scrolled()">
  @for (s of sections; track s.id) {
    <button type="button" (click)="scrollTo(s.id)">{{ s.label }}</button>
  }
</nav>
}

<main class="panel-main">
  <router-outlet />
</main>
